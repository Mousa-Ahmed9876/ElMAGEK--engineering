<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Portal - Shoubra</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Urbanist:wght@400;600&family=Amiri&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --dark-bg: #000000;
            --card-bg: #111111;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.4s ease; }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Urbanist', sans-serif;
            overflow-x: hidden;
        }

        /* --- Page 1: Landing --- */
        #landing-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .neon-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            animation: pulse 2s infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.8; transform: scale(1); }
        }

        .college-name { font-size: 1.5rem; letter-spacing: 3px; margin-bottom: 30px; }
        .quran-verse { font-family: 'Amiri', serif; font-size: 1.8rem; margin: 20px 0; color: #fff; }
        .dev-info { color: #888; font-size: 1.1rem; line-height: 1.8; margin-top: 10px; }
        .dev-info p { margin: 5px 0; }

        .btn-enter {
            margin-top: 40px;
            padding: 15px 40px;
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .btn-enter:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 30px var(--neon-blue);
        }

        /* --- Page 2: Subjects --- */
        #subjects-page {
            display: none;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .subject-card {
            background: var(--card-bg);
            border: 1px solid #222;
            padding: 30px 15px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
        }

        .subject-card:hover {
            border-color: var(--neon-blue);
            transform: translateY(-5px);
        }

        .subject-card i { font-size: 2rem; color: var(--neon-blue); margin-bottom: 15px; display: block; }
        .subject-card h3 { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; }

        .btn-back {
            display: block;
            margin: 40px auto;
            color: #555;
            text-decoration: underline;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        /* Hide Scrollbar */
        ::-webkit-scrollbar { width: 0px; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="landing-page">
        <h1 class="neon-title">WELCOME</h1>
        <h2 class="college-name">SHOUBRA FACULTY OF ENGINEERING</h2>
        
        <p class="quran-verse">"وَقُل رَّبِّ زِدْنِي عِلْمًا"</p>
        
        <div class="dev-info">
            <p>Developed by: El_Magek 👨🏻‍💻</p>
            <p>Phone: 01100575360</p>
            <p style="color: #00d2ff; font-size: 0.9rem; margin-top: 5px;">Contact the developers 👨🏻‍💻: E_lmagek</p>
        </div>

        <button class="btn-enter" onclick="navigateTo('subjects')">GO TO SECTIONS</button>
    </div>

    <div id="subjects-page">
        <h1 style="text-align:center; font-family:'Orbitron'; color:var(--neon-blue); letter-spacing: 2px;">DEPARTMENTS</h1>
        
        <div class="grid-container">
            <div class="subject-card" onclick="window.open('materials/drawing_img1.png')">
                <i class="fas fa-pencil-ruler"></i>
                <h3>ENGINEERING DRAWING</h3>
            </div>
            <div class="subject-card" onclick="window.open('materials/physics_img1.png')">
                <i class="fas fa-atom"></i>
                <h3>PHYSICS</h3>
            </div>
            <div class="subject-card" onclick="window.open('materials/math_lec1.pdf')">
                <i class="fas fa-square-root-alt"></i>
                <h3>MATHEMATICS</h3>
            </div>
            <div class="subject-card" onclick="window.open('materials/dynamics_lec1.pdf')">
                <i class="fas fa-cogs"></i>
                <h3>DYNAMICS</h3>
            </div>
            <div class="subject-card" onclick="window.open('materials/production_lec1.pdf')">
                <i class="fas fa-industry"></i>
                <h3>PRODUCTION</h3>
            </div>
            <div class="subject-card" onclick="window.open('materials/history_lec1.pdf')">
                <i class="fas fa-monument"></i>
                <h3>ENGINEERING HISTORY</h3>
            </div>
        </div>

        <button class="btn-back" onclick="navigateTo('landing')">BACK TO HOME</button>
    </div>

    <script>
        function navigateTo(page) {
            if(page === 'subjects') {
                document.getElementById('landing-page').style.display = 'none';
                document.getElementById('subjects-page').style.display = 'block';
            } else {
                document.getElementById('subjects-page').style.display = 'none';
                document.getElementById('landing-page').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
